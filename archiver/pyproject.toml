[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-archiver"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "praw==8.0.3",
    "yt-dlp==2026.8.19",
    "gallery-dl==1.32.11",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]
